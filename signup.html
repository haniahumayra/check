<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Dishcovery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background: #FDFCF8;
            overflow: hidden;
        }
        .auth-bg {
            flex: 1.2;
            background: url('images/login-signin_bg.jpeg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .auth-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
        }
        .auth-bg h1 {
            color: white;
            font-size: 5rem;
            font-family: 'Outfit', sans-serif;
            z-index: 1;
            font-weight: 800;
            letter-spacing: -2px;
        }
        .auth-container {
            flex: 0.8;
            max-width: 550px;
            padding: 2rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: white;
        }
        .auth-logo {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
        }
        .auth-header {
            margin-bottom: 2rem;
            text-align: center;
        }
        .auth-header h2 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-family: 'Outfit', serif;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-input {
            position: relative;
        }
        .form-input label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .form-input input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: #F4F4F4;
            border: none;
            border-radius: 8px;
            font-family: inherit;
        }
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: var(--transition);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #DDD;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #EEE;
        }
        .divider span {
            padding: 0 1rem;
            color: var(--text-muted);
        }
        .social-auth {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .social-btn {
            width: 45px;
            height: 45px;
            border: 1px solid #EEE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-bg">
        <h1>DishCovery</h1>
    </div>
    <div class="auth-container">
        <div class="auth-logo" style="display: flex; align-items: center; gap: 0.5rem; top: 2rem; right: 2rem; width: auto;">
            <img src="images/logo_dishcovery.png" alt="Dishcovery Logo" style="width: 40px;">
            <span style="font-weight: 800; color: #5F450F; font-family: 'Outfit', sans-serif;">DISHCOVERY</span>
        </div>
        <div class="auth-header">
            <h2>Sign Up</h2>
            <p>Create your account to continue</p>
        </div>
        <form class="auth-form" id="signup-form">
            <div class="form-input">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <div class="form-input">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-input">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>
            <div class="form-input">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password" required>
            </div>
            <button type="submit" class="auth-btn">Sign Up</button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-auth">
            <div class="social-btn"><i class="fab fa-google" style="color: #DB4437;"></i></div>
            <div class="social-btn"><i class="fab fa-apple"></i></div>
            <div class="social-btn"><i class="fab fa-facebook-f" style="color: #4267B2;"></i></div>
        </div>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').onsubmit = async (e) => {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input');
            const username = inputs[0].value;
            const email = inputs[1].value;
            const password = inputs[2].value;
            const confirmPassword = inputs[3].value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('Account created successfully! Please login.');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Sign up failed');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error. Is the server running?');
            }
        };
    </script>
</body>
</html>
