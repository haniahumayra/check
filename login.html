<!DOCTYPE html>
<html lang="en">
<head> # bisa plis
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dishcovery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background: #927b1d;
            overflow: hidden;
        }
        .auth-bg {
            flex: 1.2; 
            background: url('images/login-signin_bg.jpeg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .auth-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
        }
        .auth-bg h1 {
            color: white;
            font-size: 5rem;
            font-family: 'Outfit', sans-serif;
            z-index: 1;
            font-weight: 800;
            letter-spacing: -2px;
        }
        .auth-container {
            flex: 0.8; 
            max-width: 550px;
            padding: 0 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            background: white;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .auth-logo {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: auto;
        }
        .auth-header {
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .auth-header h2 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 0.3rem;
            font-family: 'Outfit', serif;
        }
        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .form-input {
            position: relative;
        }
        .form-input label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        .form-input input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #F4F4F4;
            border: 1px solid transparent;
            border-radius: 8px;
            font-family: inherit;
            box-sizing: border-box;
        }
        .forgot-pass {
            text-align: right;
            font-size: 0.75rem;
            color: var(--primary);
            margin-top: 0.3rem;
            cursor: pointer;
        }
        .auth-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: var(--transition);
        }
        #error-msg {
            color: #d93025;
            background-color: #fce8e6;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 0.8rem;
            display: none; 
            align-items: center;
            gap: 8px;
            font-family: 'Outfit', sans-serif;
        }
        .input-error {
            border: 1px solid #d93025 !important;
            background: #fff4f4 !important;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.2rem 0;
            color: #DDD;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #EEE;
        }
        .divider span {
            padding: 0 1rem;
            color: var(--text-muted);
        }
        .social-auth {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .social-btn {
            width: 45px;
            height: 45px;
            border: 1px solid #EEE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-bg">
        <h1>DishCovery</h1>
    </div>
    <div class="auth-container">
        <div class="auth-logo">
            <img src="images/logo_dishcovery.png" alt="Dishcovery Logo" style="width: 40px;">
            <span style="font-weight: 800; color: #5F450F; font-family: 'Outfit', sans-serif;">DISHCOVERY</span>
        </div>
        <div class="auth-header">
            <h2>login</h2>
            <p>Welcome back! Please login to your account</p>
        </div>

        <div id="error-msg">
            <i class="fas fa-exclamation-circle"></i> 
            <span id="error-text"></span>
        </div>

        <form class="auth-form" id="login-form">
            <div class="form-input">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="form-input">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password">
                <div class="forgot-pass">Forgot Password?</div>
            </div>
            <button type="submit" class="auth-btn">LOGIN</button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-auth">
            <div class="social-btn"><i class="fab fa-google" style="color: #DB4437;"></i></div>
            <div class="social-btn"><i class="fab fa-apple" style="color: #000;"></i></div>
            <div class="social-btn"><i class="fab fa-facebook-f" style="color: #4267B2;"></i></div>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');

            errorMsg.style.display = 'none';
            emailField.classList.remove('input-error');
            passwordField.classList.remove('input-error');

            if (!emailField.value || !passwordField.value) {
                errorText.innerText = "Please fill in all fields.";
                errorMsg.style.display = 'flex';
                if(!emailField.value) emailField.classList.add('input-error');
                if(!passwordField.value) passwordField.classList.add('input-error');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailField.value, password: passwordField.value })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    const msg = (data.error || "").toLowerCase();
                    if (msg.includes("found") || msg.includes("exist")) {
                        errorText.innerText = "Account not found. Please sign up first.";
                    } else {
                        errorText.innerText = "The email or password you entered is incorrect.";
                    }
                    errorMsg.style.display = 'flex';
                    emailField.classList.add('input-error');
                    passwordField.classList.add('input-error');
                }
            } catch (err) {
                errorText.innerText = "Connection error. Is the server running?";
                errorMsg.style.display = 'flex';
            }
        };
    </script>
</body>
</html>
